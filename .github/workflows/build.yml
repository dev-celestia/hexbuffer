name: Build & Generate Artifacts

on:
  push:
    tags:
      - 'v*' # Triggers on version tags (e.g. v1.0.0). Use '*' to match any tag.
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_name: hexbuffer-linux
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            platform: macos
            artifact_name: hexbuffer-macos
            artifact_path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: hexbuffer-windows
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libdbus-1-dev \
            patchelf \
            libfuse2 \
            file \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Ensure sidecar binaries exist
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.platform }}" in
            linux)
              [ -f src-tauri/binaries/ai-engine-x86_64-unknown-linux-gnu ] || (touch src-tauri/binaries/ai-engine-x86_64-unknown-linux-gnu && chmod +x src-tauri/binaries/ai-engine-x86_64-unknown-linux-gnu)
              ;;
            macos)
              [ -f src-tauri/binaries/ai-engine-aarch64-apple-darwin ] || (touch src-tauri/binaries/ai-engine-aarch64-apple-darwin && chmod +x src-tauri/binaries/ai-engine-aarch64-apple-darwin)
              [ -f src-tauri/binaries/ai-engine-x86_64-apple-darwin ] || (touch src-tauri/binaries/ai-engine-x86_64-apple-darwin && chmod +x src-tauri/binaries/ai-engine-x86_64-apple-darwin)
              ;;
            windows)
              [ -f src-tauri/binaries/ai-engine-x86_64-pc-windows-msvc.exe ] || touch src-tauri/binaries/ai-engine-x86_64-pc-windows-msvc.exe
              ;;
          esac

      - name: Build Tauri app & sidecars
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Create Automated GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hexbuffer ${{ github.ref_name }}"
          body: |
            Automated Build

            This release was automatically built from tag `${{ github.ref_name }}`.

            - **Commit:** ${{ github.sha }}
            - **Workflow Run:** ${{ github.run_id }}
            - **Environment:** multi-platform (Linux, macOS, Windows)
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

