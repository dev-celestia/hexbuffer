[package]
name = "hexbuffer"
version = "1.0.1"
description = "Proxy App"
authors = ["Arham"]
edition = "2021"
license = "MIT"

[lib]
name = "hexbuffer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-pty = "0.3"
tauri-plugin-notification = { version = "2", features = ["windows7-compat"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }


axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
local-ip-address = "0.6"
qrcode = "0.14"

hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
http = "1"
url = "2.5.8"
base64 = "0.22"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
tempfile = "3"
hexbuffer-proxy = { git = "https://github.com/arhamymr/hexbuffer-proxy.git" }
browser-crawler = { git = "https://github.com/arhamymr/browser-crawler.git" }
hexbuffer-ai = { git = "https://github.com/arhamymr/hexbuffer-agent.git" }
rig-core = "0.7"
thiserror = "2"
rayon = "1.10"
memmap2 = "0.9"
ahash = "0.8"
blake3 = "1.5"
argon2 = "0.5"
bcrypt = "0.16"
scrypt = "0.11"
hex = "0.4"
sha3 = "0.10"
ripemd = "0.1"
parking_lot = "0.12"
sysinfo = "0.33"
