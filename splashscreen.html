<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexbuffer</title>
  <style>
    :root {
      color-scheme: dark;
      --primary: #00c950;
      --primary-glow: rgba(0, 201, 80, 0.25);
      --background: #000000;
      --card-bg: #000000;
      --foreground: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* Minimal Solid Black Card with No Border */
    .splash-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
      border: none;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
      box-shadow: none;
      overflow: hidden;
    }

    /* Soft Ambient Glow */
    .ambient-glow {
      position: absolute;
      width: 100px;
      height: 100px;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0, 201, 80, 0) 70%);
      filter: blur(28px);
      pointer-events: none;
      opacity: 0.45;
      z-index: 0;
    }

    /* Carousel Main Area */
    .carousel-container {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px) scale(0.95);
      filter: blur(3px);
      transition: 
        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }

    .slide.exit {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-16px) scale(0.95);
      filter: blur(3px);
    }

    /* Icon Container */
    .icon-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
    }

    .slide-image {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.4));
      border-radius: 8px;
    }

    /* Footer with Triangle Logo + Hexbuffer */
    .footer-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 1;
    }

    .dots-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .dot.active {
      width: 14px;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary-glow);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0.85;
    }

    .triangle-logo-sm {
      position: relative;
      display: inline-flex;
      width: 0.8rem;
      height: 0.8rem;
      color: var(--primary);
      flex-shrink: 0;
      animation: triangle-pulse 2.8s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    .triangle-icon {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      transform-origin: center;
      stroke: currentColor;
      will-change: opacity, transform;
    }

    .triangle-icon.solid {
      animation: triangle-solid 2.8s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    .triangle-icon.dashed {
      animation: triangle-dashed 2.8s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    .brand-name {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.8);
    }

    @keyframes triangle-pulse {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.08); }
    }

    @keyframes triangle-solid {
      0%, 38%, 100% { opacity: 1; transform: rotate(0deg) scale(1); }
      50%, 88% { opacity: 0; transform: rotate(8deg) scale(0.88); }
    }

    @keyframes triangle-dashed {
      0%, 38%, 100% { opacity: 0; transform: rotate(-8deg) scale(0.88); }
      50%, 88% { opacity: 1; transform: rotate(0deg) scale(1); }
    }
  </style>
</head>

    <footer class="footer-bar" data-tauri-drag-region>

  </div>

  <script>
    (function () {
      var slides = Array.from(document.querySelectorAll('.slide'));
      var dots = Array.from(document.querySelectorAll('.dot'));
      var currentIndex = 0;
      var totalSlides = slides.length;
      var intervalId = null;
      var SLIDE_DURATION = 1400;

      function goToSlide(nextIndex) {
        if (nextIndex === currentIndex) return;

        var currentSlide = slides[currentIndex];
        var nextSlide = slides[nextIndex];

        currentSlide.classList.remove('active');
        currentSlide.classList.add('exit');

        nextSlide.classList.remove('exit');
        nextSlide.classList.add('active');

        dots[currentIndex].classList.remove('active');
        dots[nextIndex].classList.add('active');

        setTimeout(function () {
          currentSlide.classList.remove('exit');
        }, 450);

        currentIndex = nextIndex;
      }

      function nextSlide() {
        var next = (currentIndex + 1) % totalSlides;
        goToSlide(next);
      }

      function startSlideshow() {
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(nextSlide, SLIDE_DURATION);
      }

      dots.forEach(function (dot) {
        dot.addEventListener('click', function () {
          var index = parseInt(dot.getAttribute('data-index'), 10);
          if (!isNaN(index)) {
            goToSlide(index);
            startSlideshow();
          }
        });
      });

      startSlideshow();
    })();
  </script>
</body>

</html>
